<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limb Symmetry Report</title>
    
    <link rel="icon" href="./assets/logo.png" type="image/png">

  <script type="module" crossorigin src="./assets/limbSymmetry-D5taHTty.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/utils-Dnk4PiOV.js">
  <link rel="stylesheet" crossorigin href="./assets/utils-D2hamNqz.css">
  <link rel="stylesheet" crossorigin href="./assets/limbSymmetry-DZN6W_O8.css">
</head>
<body>
    <header class="subpage-header">
        <a href="index.html">
            <img src="./assets/logo.svg" alt="Primary Logo" class="logo">
        </a>
        <div class="header-controls">
            <div class="toggle-container">
                <label class="switch theme-switch">
                    <input type="checkbox" id="lightModeToggle">
                    <span class="slider round"></span>
                </label>
                <span class="toggle-label" id="themeLabel">Dark Mode</span>
            </div>
            <button id="toggleConfigBtn" class="button blue-button">Customize</button>
            <button id="printBtn" class="button green-button">Print</button>
        </div>
        
        <!-- Print Configuration Panel -->
        <div id="printConfigPanel" class="print-config-panel">
            <h3>Report Sections</h3>
            <div id="configCheckboxes"></div>
            <hr style="border: 0; border-top: 1px solid var(--border-color-light); margin: 10px 0;">
        </div>
    </header>

    <div class="page-container">
        <h2 class="text-center report-title">Limb Symmetry Report</h2>
        <table class="report-table">
            <colgroup>
                <col class="c1">
                <col class="c2">
                <col class="c3">
                <col class="c4">
                <col class="c5">
                <col class="c6">
            </colgroup>
            <!-- Content Generated via JS -->
            <tbody id="reportTableBody"></tbody>
        </table>
    </div>

    <footer>
        <div class="button-container">
            <h3>Under Construction</h3>
            <a href="/" class="button green-button">
                <img src="./assets/experimental.svg" alt="experimental icon" class="icon">
                Experimental
            </a>
            <a href="mailto:will.liu014@gmail.com" class="button pending-button">
                Contact Me
            </a>
        </div>
    </footer>

</body>
</html>
